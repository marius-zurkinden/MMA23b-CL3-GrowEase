<!doctype html>
<html lang="de">
  <head>
    <!-- Meta-Daten, Global-Styles und seiteninterne Layout-Regeln -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kunden</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      .page-header {
        padding: 48px 80px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .page-header h1 {
        font-family: var(--font-display);
        font-size: 32px;
      }
      .kunden-wrapper {
        padding: 32px 80px 72px;
      }
      @media (max-width: 900px) {
        .page-header {
          padding: 32px 24px 0;
        }
        .kunden-wrapper {
          padding: 24px 24px 48px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Such- und Überschriftenbereich -->
    <div class="page-header">
      <h1>Kunden</h1>
      <input
        type="search"
        class="search-bar"
        id="kundenSearch"
        placeholder="Kunden suchen…"
        oninput="filterKunden()"
      />
    </div>
    <!-- Kundenkacheln / Ergebnisliste -->
    <div class="kunden-wrapper">
      <div class="kunden-grid" id="kundenGrid">
        <div
          class="loading-placeholder"
          style="height: 100px; border-radius: 8px"
        ></div>
        <div
          class="loading-placeholder"
          style="height: 100px; border-radius: 8px"
        ></div>
        <div
          class="loading-placeholder"
          style="height: 100px; border-radius: 8px"
        ></div>
      </div>
    </div>

    <!-- Seitenfuß mit Schnellnavigation -->
    <footer>
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Growease</h4>
          <ul>
            <li><a href="index.html">Startseite</a></li>
            <li><a href="produkte.html">Produkte</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Service</h4>
          <ul>
            <li><a href="bestellungen.html">Bestellungen</a></li>
            <li><a href="kunden.html">Kunden</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Info</h4>
          <ul>
            <li><a href="#">Über uns</a></li>
            <li><a href="#">AGB</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Folge uns</h4>
          <div class="footer-social">
            <div class="social-dot">in</div>
            <div class="social-dot">fb</div>
            <div class="social-dot">tk</div>
            <div class="social-dot">pt</div>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2025 Growease. Alle Rechte vorbehalten.</div>
    </footer>

    <!-- Navigation und Kunden-Datenlogik -->
    <script src="assets/js/nav.js"></script>
    <script>
      const API_BASE = "http://localhost:8081/api.php/records";
      let allKunden = [];

      async function loadKunden() {
        const grid = document.getElementById("kundenGrid");
        try {
          const res = await fetch(`${API_BASE}/Kunde?limit=50`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          allKunden = data.records || [];
          if (allKunden.length === 0) throw new Error("empty");
          renderKunden(allKunden);
        } catch {
          allKunden = [
            {
              id: 1,
              Vorname: "Anna",
              Nachname: "Müller",
              Email: "anna.mueller@example.com",
              Ort: "Zürich",
            },
            {
              id: 2,
              Vorname: "Beat",
              Nachname: "Keller",
              Email: "beat.keller@example.com",
              Ort: "Bern",
            },
            {
              id: 3,
              Vorname: "Carmen",
              Nachname: "Huber",
              Email: "carmen.huber@example.com",
              Ort: "Luzern",
            },
            {
              id: 4,
              Vorname: "David",
              Nachname: "Schneider",
              Email: "david.schneider@example.com",
              Ort: "Basel",
            },
            {
              id: 5,
              Vorname: "Eva",
              Nachname: "Fischer",
              Email: "eva.fischer@example.com",
              Ort: "Winterthur",
            },
            {
              id: 6,
              Vorname: "Franz",
              Nachname: "Weber",
              Email: "franz.weber@example.com",
              Ort: "St. Gallen",
            },
          ];
          renderKunden(allKunden);
        }
      }

      function filterKunden() {
        const q = document.getElementById("kundenSearch").value.toLowerCase();
        renderKunden(
          allKunden.filter((k) => {
            const name = `${k.Vorname || ""} ${k.Nachname || ""}`.toLowerCase();
            return (
              name.includes(q) ||
              (k.Email || "").toLowerCase().includes(q) ||
              (k.Ort || "").toLowerCase().includes(q)
            );
          }),
        );
      }

      function renderKunden(list) {
        const grid = document.getElementById("kundenGrid");
        if (list.length === 0) {
          grid.innerHTML =
            '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:48px 0;">Keine Kunden gefunden.</p>';
          return;
        }
        grid.innerHTML = list
          .map(
            (k) => `
    <div class="kunden-card">
      <h3>${k.Vorname || ""} ${k.Nachname || k.Name || ""}</h3>
      ${k.Email ? `<p>✉ ${k.Email}</p>` : ""}
      ${k.Telefon ? `<p>📞 ${k.Telefon}</p>` : ""}
      ${k.Ort ? `<p>📍 ${k.Ort}</p>` : ""}
    </div>
  `,
          )
          .join("");
      }

      loadKunden();
    </script>
  </body>
</html>
