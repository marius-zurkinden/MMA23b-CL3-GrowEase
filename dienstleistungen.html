<!doctype html>
<html lang="de">
  <head>
    <!-- Meta-Daten und Styles für die Dienstleistungsseite -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dienstleistungen</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <!-- Übersicht der Dienstleistungen -->
    <section style="padding: 72px 80px; max-width: 1200px; margin: 0 auto">
      <h1 class="section-title" style="text-align: left">
        Unsere Dienstleistungen
      </h1>
      <div class="services-list" id="servicesList">
        <div
          class="loading-placeholder"
          style="height: 80px; border-radius: 8px; margin-bottom: 8px"
        ></div>
        <div
          class="loading-placeholder"
          style="height: 80px; border-radius: 8px; margin-bottom: 8px"
        ></div>
        <div
          class="loading-placeholder"
          style="height: 80px; border-radius: 8px; margin-bottom: 8px"
        ></div>
      </div>
    </section>

    <!-- Seitenfuß mit Schnellnavigation -->
    <footer>
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Growease</h4>
          <ul>
            <li><a href="index.html">Startseite</a></li>
            <li><a href="produkte.html">Produkte</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Service</h4>
          <ul>
            <li><a href="bestellungen.html">Bestellungen</a></li>
            <li><a href="kunden.html">Kunden</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Info</h4>
          <ul>
            <li><a href="#">Über uns</a></li>
            <li><a href="#">AGB</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Folge uns</h4>
          <div class="footer-social">
            <div class="social-dot">in</div>
            <div class="social-dot">fb</div>
            <div class="social-dot">tk</div>
            <div class="social-dot">pt</div>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2025 Growease. Alle Rechte vorbehalten.</div>
    </footer>

    <!-- Navigation und Dienstleistungsdaten -->
    <script src="assets/js/nav.js"></script>
    <script>
      const API_BASE = "http://localhost:8081/api.php/records";

      async function loadServices() {
        const list = document.getElementById("servicesList");
        try {
          const res = await fetch(`${API_BASE}/Dienstleistung?limit=20`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const records = data.records || [];
          if (records.length === 0) throw new Error("empty");
          renderServices(records);
        } catch {
          // Fallback
          renderServices([
            {
              id: 1,
              Name: "Gartenplanung",
              Beschreibung: "Professionelle Planung Ihres Traumgartens",
            },
            {
              id: 2,
              Name: "Bepflanzungsservice",
              Beschreibung: "Wir bepflanzen Beete, Töpfe und Hochbeete",
            },
            {
              id: 3,
              Name: "Pflanzenpflege-Abo",
              Beschreibung:
                "Regelmäßige Pflege Ihrer Pflanzen durch unsere Experten",
            },
            {
              id: 4,
              Name: "Beratung & Coaching",
              Beschreibung: "Persönliche Gartenberatung vor Ort oder online",
            },
            {
              id: 5,
              Name: "Hochbeet-Aufbau",
              Beschreibung: "Wir bauen und bepflanzen Ihr Hochbeet",
            },
            {
              id: 6,
              Name: "Saison-Service",
              Beschreibung: "Vorbereitung und Einwinterung Ihres Gartens",
            },
          ]);
        }
      }

      function renderServices(services) {
        const list = document.getElementById("servicesList");
        list.innerHTML = services
          .map(
            (s) => `
    <div class="service-row">
      <div class="service-img img-container">
        ${s.Bild ? `<img src="${s.Bild}" alt="${s.Name}" onerror="this.style.display='none'"/>` : ""}
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--green-mid);">🌿</div>
      </div>
      <div class="service-info">
        <h3>${s.Name || s.Bezeichnung || "Dienstleistung"}</h3>
        <p>${s.Beschreibung || ""}</p>
      </div>
      <span class="service-arrow">›</span>
    </div>
  `,
          )
          .join("");
      }

      loadServices();
    </script>
  </body>
</html>
